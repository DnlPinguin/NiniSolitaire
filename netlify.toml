# Nuxt laeuft auf Netlify serverseitig (Functions). Das ist wichtig, weil die
# Geburtstagskarte per Cookie entscheidet, ob sie gezeigt wird - beim rein
# statischen Erzeugen wuerde diese Entscheidung ins HTML eingebacken.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# In-App-Browser (WhatsApp, Instagram) halten die Seite hartnaeckig im
# Zwischenspeicher fest - beim Antippen des Links kam so die alte, kaputte
# Fassung. Das Dokument selbst muss deshalb jedes Mal neu geholt werden.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Dateinamen mit Pruefsumme duerfen dagegen lange liegen bleiben.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pups/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
