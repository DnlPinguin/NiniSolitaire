<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 3</title>
<style>
  html, body { margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #ffd9ec; }

  /* GRUEN: klebt am Fenster. Kann durch Scrollen NICHT verschwinden. */
  .fest {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: #0a7f3f; color: #fff;
    padding: 14px 12px; font-weight: 800; font-size: 17px;
  }
  /* ROT: liegt normal im Textfluss. Verschwindet, wenn die Seite scrollt. */
  .fluss {
    background: #c0143c; color: #fff;
    padding: 14px 12px; font-weight: 800; font-size: 17px;
    margin-top: 52px;   /* Platz, damit der gruene Balken nichts verdeckt */
  }
  .text { padding: 16px 12px; color: #6b2547; line-height: 1.5; }
  pre { margin: 0; padding: 12px; background: #17141c; color: #7CFFB2;
        font: 600 13px/1.6 ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="fest">▲ GRÜN — klebt am Fenster</div>
  <div class="fluss">▲ ROT — liegt in der Seite</div>
  <div class="text">
    Beide Balken gehören ganz nach oben.<br>
    Welche siehst du?
  </div>
  <pre id="w"></pre>
  <script>
    function zeig() {
      document.getElementById('w').textContent = [
        'innerHeight   ' + window.innerHeight,
        'screen.height ' + window.screen.height,
        'clientHeight  ' + document.documentElement.clientHeight,
        'scrollY       ' + Math.round(window.scrollY),
        'scrollbar?    ' + (document.documentElement.scrollHeight > document.documentElement.clientHeight),
        'body-Hoehe    ' + Math.round(document.body.getBoundingClientRect().height)
      ].join('\n');
    }
    zeig(); setInterval(zeig, 400);
  </script>
</body>
</html>
