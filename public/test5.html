<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 5 - Zoom pruefen</title>
<style>
  html, body { margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #ffd9ec; }
  .oben { background: #0a7f3f; color: #fff; padding: 12px; font-weight: 800; font-size: 16px; }
  pre { margin: 0; padding: 12px; background: #17141c; color: #7CFFB2;
        font: 600 14px/1.7 ui-monospace, monospace; white-space: pre-wrap; }
  .probe { width: 100px; height: 20px; background: #c0143c; }
  .hinweis { padding: 12px; color: #6b2547; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="oben">▲ OBEN</div>
  <div class="hinweis">
    Der rote Balken ist per CSS exakt <b>100 Punkte</b> breit.
    Ist er deutlich breiter oder schmaler als ein Viertel des Bildschirms,
    ist die Seite vergrößert dargestellt.
  </div>
  <div class="probe" id="probe"></div>
  <pre id="w"></pre>
  <script>
    function zeig() {
      var d = document.documentElement;
      var vv = window.visualViewport;
      var p = document.getElementById('probe').getBoundingClientRect();
      document.getElementById('w').textContent = [
        'Fensterbreite   ' + d.clientWidth,
        'screen.width    ' + window.screen.width,
        'devicePixelRatio ' + window.devicePixelRatio,
        'visualVP.scale  ' + (vv ? vv.scale : '-'),
        'roter Balken    ' + Math.round(p.width) + ' statt 100',
        '---',
        'innerHeight     ' + window.innerHeight,
        'clientHeight    ' + d.clientHeight,
        'Seitenhoehe     ' + d.scrollHeight,
        'scrollY         ' + Math.round(window.scrollY),
        'scrollbar?      ' + (d.scrollHeight > d.clientHeight)
      ].join('\n');
    }
    zeig(); setInterval(zeig, 400);
  </script>
</body>
</html>
