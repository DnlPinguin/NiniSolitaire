<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 4 - lange Seite</title>
<style>
  html, body { margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #ffd9ec; }
  .oben { background: #0a7f3f; color: #fff; padding: 14px 12px; font-weight: 800; font-size: 17px; }
  .lineal { border-top: 2px solid rgba(122,18,70,.35); padding: 4px 12px;
            font: 600 12px ui-monospace, monospace; color: #7a1246; }
  pre { margin: 0; padding: 12px; background: #17141c; color: #7CFFB2;
        font: 600 13px/1.6 ui-monospace, monospace; }
  .ende { background: #7a1246; color: #fff; padding: 14px 12px; font-weight: 800; }
</style>
</head>
<body>
  <div class="oben">▲ OBEN — diese Seite ist absichtlich LANG (scrollbar)</div>
  <pre id="w"></pre>
  <div id="lineale"></div>
  <div class="ende">▼ ENDE der langen Seite</div>
  <script>
    // Lineal alle 100 Punkte, damit man sofort sieht, wo die Seite beginnt
    var l = document.getElementById('lineale');
    for (var y = 100; y <= 2000; y += 100) {
      var d = document.createElement('div');
      d.className = 'lineal';
      d.style.height = '78px';
      d.textContent = y + ' Punkte';
      l.appendChild(d);
    }
    function zeig() {
      document.getElementById('w').textContent = [
        'innerHeight   ' + window.innerHeight,
        'screen.height ' + window.screen.height,
        'clientHeight  ' + document.documentElement.clientHeight,
        'scrollY       ' + Math.round(window.scrollY),
        'Seitenhoehe   ' + document.documentElement.scrollHeight,
        'scrollbar?    ' + (document.documentElement.scrollHeight > document.documentElement.clientHeight)
      ].join('\n');
    }
    zeig(); setInterval(zeig, 400);
  </script>
</body>
</html>
